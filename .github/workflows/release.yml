name: Release

# Consumers write `@v1` and expect fixes without editing their workflow, so the
# major tag has to follow each release. Push an immutable tag (v1.2.3) and this
# re-points the moving one (v1) at it.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-point the major tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAJOR="${RELEASE_TAG%%.*}"          # v1.2.3 -> v1
          echo "Moving $MAJOR to $RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$RELEASE_TAG"
          git push -f origin "refs/tags/$MAJOR"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — nothing to do."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes
